name: Phase 12G Readiness Factual Repair

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/phase12g_apply_readiness_factual_repair.py'
      - '.github/workflows/phase12g-readiness-factual-repair.yml'

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply guarded canonical repair
        run: python3 scripts/phase12g_apply_readiness_factual_repair.py

      - name: Remove one-shot repair machinery
        run: |
          rm scripts/phase12g_apply_readiness_factual_repair.py
          rm .github/workflows/phase12g-readiness-factual-repair.yml

      - name: Commit repaired source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repair diff remains.'
            exit 0
          fi
          git commit -m 'Repair factual Phase 12G readiness failures [skip ci]'
          git push origin HEAD:${{ github.head_ref }}
