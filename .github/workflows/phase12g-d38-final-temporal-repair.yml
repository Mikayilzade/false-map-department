name: Phase12G One-Shot D38 Final Temporal Repair

on:
  push:
    branches:
      - phase12g-d38-final-temporal-repair-20260824

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[d38-final-temporal-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v5
        with:
          ref: phase12g-d38-final-temporal-repair-20260824

      - name: Apply and validate final D38 temporal repair
        shell: bash
        run: |
          set +e
          python3 scripts/phase12g_apply_d38_final_temporal_repair.py
          repair_rc=$?
          python3 scripts/phase12d_act5_content_audit.py
          act5_rc=$?
          python3 scripts/phase12d_full_catalog_audit.py
          catalog_rc=$?
          python3 scripts/phase12g_acquisition_readiness_audit.py
          acquisition_rc=$?

          if [ "$repair_rc" -ne 0 ] || [ "$act5_rc" -ne 0 ] || [ "$catalog_rc" -ne 0 ] || [ "$acquisition_rc" -ne 0 ]; then
            echo "D38 final temporal repair validation failed: repair=$repair_rc act5=$act5_rc catalog=$catalog_rc acquisition=$acquisition_rc"
            exit 0
          fi

          git rm scripts/phase12g_apply_d38_final_temporal_repair.py .github/workflows/phase12g-d38-final-temporal-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/campaign/D38.json scripts/phase12d_act5_content_audit.py tests/test_act5_content_runner.gd
          git commit -m "Align D38 Stability witness with canonical P10-R3 [d38-final-temporal-repair]"
          git push origin HEAD:phase12g-d38-final-temporal-repair-20260824
