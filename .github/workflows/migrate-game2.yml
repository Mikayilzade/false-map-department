name: One-time Game 002 migration

on:
  push:
    paths:
      - 'MIGRATION_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone factory
        run: git clone --depth 1 https://github.com/Mikayilzade/gpt-game-autonomy.git /tmp/factory

      - name: Copy frozen False Map Department package
        shell: bash
        run: |
          set -euo pipefail
          files=(
            GAME2_RESEARCH.md
            GAME2_TOURNAMENT.md
            GAME2_TOURNAMENT_RUN4.md
            GAME2_TOURNAMENT_RUN5.md
            GAME2_PRODUCT_THESIS.md
            GAME2_MECHANICAL_ARCHITECTURE.md
            GAME2_CONTENT_ARCHITECTURE.md
            GAME2_UX_PRESENTATION_ARCHITECTURE.md
            GAME2_ECONOMY_COMMERCIAL.md
            GAME2_TECHNICAL_SPEC.md
            GAME2_WHOLE_GAME_SIMULATION.md
            GAME2_ADVERSARIAL_REVIEW.md
            GAME2_PHASE11_FINAL_FREEZE.md
          )
          for f in "${files[@]}"; do
            test -f "/tmp/factory/$f"
            cp "/tmp/factory/$f" "$f"
          done
          cp /tmp/factory/GAME2_IMPLEMENTATION_START_HERE.md IMPLEMENTATION_START_HERE.md
          cp /tmp/factory/GAME2_IMPLEMENTATION_STATUS.md IMPLEMENTATION_STATUS.md
          cp /tmp/factory/GAME2_MIGRATION_MANIFEST.md MIGRATION_MANIFEST.md

          cat >> IMPLEMENTATION_START_HERE.md <<'EOF'

## CI / email-noise guardrail
Read `CI_NOTIFICATION_POLICY.md` before creating GitHub Actions workflows.

During unstable bootstrap/vertical-slice work, do not create push-triggered CI that is expected to fail repeatedly. Run headless tests locally in the implementation session where possible; if remote CI is needed before the baseline is stable, keep it manual (`workflow_dispatch`). Enable automatic push/PR CI only after the baseline suite is consistently green. If a CI change begins generating repeated failures, return it to manual-only until fixed.

GitHub email delivery is controlled by account/repository notification settings; this rule prevents the main avoidable source of spam: repeated failing Actions runs.
EOF

          cat > README.md <<'EOF'
# False Map Department

Design is complete and specification-frozen. Production implementation has not started.

Implementation chat: read in this order:
1. `IMPLEMENTATION_START_HERE.md`
2. `CI_NOTIFICATION_POLICY.md`
3. `IMPLEMENTATION_STATUS.md`
4. `GAME2_PHASE11_FINAL_FREEZE.md`
5. the canonical files named by the handoff/final freeze.

Highest gameplay authority: `GAME2_PHASE11_FINAL_FREEZE.md`.

Do not redesign casually during implementation. Record and reconcile any real canonical contradiction before changing gameplay.
EOF

          rm -f MIGRATION_TRIGGER
          rm -f .github/workflows/migrate-game2.yml

      - name: Commit migrated package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate frozen False Map Department design and implementation handoff"
          git push
