name: Automatic Godot Baseline Evidence

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'content/**'
      - 'scripts/**'
      - 'empirical/**'
      - 'project.godot'
      - '.godot-version'

permissions:
  contents: write

concurrency:
  group: fmd-automatic-godot-main
  cancel-in-progress: true

jobs:
  godot-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Run notification-safe baseline and persist evidence
        shell: bash
        run: |
          set +e

          EVIDENCE_DIR="${RUNNER_TEMP}/fmd-runtime-baseline"
          REPO_EVIDENCE="runtime-evidence/phase12c/latest"
          mkdir -p "$EVIDENCE_DIR" "$REPO_EVIDENCE"

          cat > "$EVIDENCE_DIR/run-metadata.txt" <<EOF
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          workflow=$GITHUB_WORKFLOW
          head_sha=$GITHUB_SHA
          ref=$GITHUB_REF
          runner_os=$RUNNER_OS
          EOF

          bash scripts/fetch_pinned_godot.sh /tmp/godot-4.7.1 \
            > "$EVIDENCE_DIR/fetch-godot.stdout.log" \
            2> "$EVIDENCE_DIR/fetch-godot.stderr.log"
          fetch_rc=$?

          runtime_rc=98
          phase12g_rc=98
          if [ "$fetch_rc" -eq 0 ]; then
            GODOT_BIN="$(tail -n 1 "$EVIDENCE_DIR/fetch-godot.stdout.log")"
            export GODOT_BIN
            FMD_FETCH_PINNED_GODOT=0 \
            FMD_RUNTIME_OUT="$EVIDENCE_DIR/runtime" \
              bash scripts/run_phase12a_runtime.sh \
                > "$EVIDENCE_DIR/runtime-wrapper.stdout.log" \
                2> "$EVIDENCE_DIR/runtime-wrapper.stderr.log"
            runtime_rc=$?

            FMD_PHASE12G_OUT="$EVIDENCE_DIR/phase12g" \
            GODOT_BIN="$GODOT_BIN" \
              bash scripts/run_phase12g_instrumentation.sh \
                > "$EVIDENCE_DIR/phase12g-wrapper.stdout.log" \
                2> "$EVIDENCE_DIR/phase12g-wrapper.stderr.log"
            phase12g_rc=$?
          fi

          python3 scripts/ci_policy_preflight.py \
            > "$EVIDENCE_DIR/ci-policy.stdout.log" \
            2> "$EVIDENCE_DIR/ci-policy.stderr.log"
          ci_policy_rc=$?

          python3 scripts/bootstrap_preflight.py \
            > "$EVIDENCE_DIR/bootstrap-preflight.stdout.log" \
            2> "$EVIDENCE_DIR/bootstrap-preflight.stderr.log"
          bootstrap_rc=$?

          python3 scripts/phase12a_contract_audit.py \
            > "$EVIDENCE_DIR/phase12a-contract.stdout.log" \
            2> "$EVIDENCE_DIR/phase12a-contract.stderr.log"
          contract_rc=$?

          result=FAIL
          if [ "$fetch_rc" -eq 0 ] && [ "$runtime_rc" -eq 0 ] && \
             [ "$phase12g_rc" -eq 0 ] && [ "$ci_policy_rc" -eq 0 ] && \
             [ "$bootstrap_rc" -eq 0 ] && [ "$contract_rc" -eq 0 ]; then
            result=PASS
          fi

          python3 - "$EVIDENCE_DIR/result.json" "$result" "$fetch_rc" "$runtime_rc" "$phase12g_rc" "$ci_policy_rc" "$bootstrap_rc" "$contract_rc" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          payload = {
              "result": sys.argv[2],
              "fetch_godot_rc": int(sys.argv[3]),
              "runtime_rc": int(sys.argv[4]),
              "phase12g_instrumentation_rc": int(sys.argv[5]),
              "ci_policy_rc": int(sys.argv[6]),
              "bootstrap_preflight_rc": int(sys.argv[7]),
              "phase12a_contract_rc": int(sys.argv[8]),
          }
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          rm -rf "$REPO_EVIDENCE"
          mkdir -p "$REPO_EVIDENCE"
          cp -a "$EVIDENCE_DIR/." "$REPO_EVIDENCE/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPO_EVIDENCE"
          git commit -m "Record automatic Godot baseline: $result [skip ci]" || true
          git pull --rebase origin main
          git push origin HEAD:main

          echo "Automatic baseline result recorded as $result in $REPO_EVIDENCE/result.json"

          # Keep the workflow itself green. PASS/FAIL lives in committed evidence,
          # so runtime defects do not recreate failure-email spam.
          exit 0

      - name: Run requested E7 live capture batch
        id: e7live
        shell: bash
        run: |
          set +e
          REQUEST="empirical/E7_LIVE_BATCH_REQUEST.json"
          if [ ! -f "$REQUEST" ]; then
            echo "requested=false" >> "$GITHUB_OUTPUT"
            echo "No E7 live-capture request marker; skipping."
            exit 0
          fi
          echo "requested=true" >> "$GITHUB_OUTPUT"

          OUT="${RUNNER_TEMP}/fmd-e7-live-batch"
          DEST="runtime-evidence/phase12g/e7-live-batch"
          BASELINE_DIR="${RUNNER_TEMP}/fmd-runtime-baseline"
          mkdir -p "$OUT" "$DEST"

          request_sha="$(sha256sum "$REQUEST" | awk '{print $1}')"
          scenario_id="$(python3 - "$REQUEST" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1], encoding='utf-8'))
          print(p.get('scenario_id',''))
          PY
          )"
          mapfile -t dossier_ids < <(python3 - "$REQUEST" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1], encoding='utf-8'))
          for item in p.get('dossier_ids', []):
              print(item)
          PY
          )

          capture_rc=97
          GODOT_BIN=""
          if [ -s "$BASELINE_DIR/fetch-godot.stdout.log" ]; then
            GODOT_BIN="$(tail -n 1 "$BASELINE_DIR/fetch-godot.stdout.log")"
          fi
          if [ -n "$GODOT_BIN" ] && [ -n "$scenario_id" ] && [ "${#dossier_ids[@]}" -gt 0 ]; then
            args=(
              --execute
              --godot "$GODOT_BIN"
              --output-dir "$OUT"
              --scenario-id "$scenario_id"
            )
            for dossier_id in "${dossier_ids[@]}"; do
              args+=(--dossier-id "$dossier_id")
            done
            python3 scripts/phase12g_e7_capture.py "${args[@]}" \
              > "$OUT/capture-command.stdout.log" \
              2> "$OUT/capture-command.stderr.log"
            capture_rc=$?
          else
            printf 'Request/Godot precondition failed: godot=%s scenario=%s dossier_count=%s\n' "$GODOT_BIN" "$scenario_id" "${#dossier_ids[@]}" > "$OUT/capture-command.stderr.log"
          fi

          if [ -f "$OUT/capture-manifest.json" ]; then
            cp "$OUT/capture-manifest.json" "$DEST/capture-manifest.json"
          else
            printf '{"schema_version":1,"gate_id":"E7","evidence_kind":"CAPTURE_ACQUISITION_MANIFEST_NOT_REVIEW_OUTCOME","status":"CAPTURE_COMMAND_DID_NOT_PRODUCE_MANIFEST","capture_rc":%s}\n' "$capture_rc" > "$DEST/capture-manifest.json"
          fi
          if [ -f "$OUT/runtime-readiness.json" ]; then
            cp "$OUT/runtime-readiness.json" "$DEST/runtime-readiness.json"
          fi
          printf '%s\n' "${dossier_ids[@]}" > "$DEST/requested-dossiers.txt"
          cat > "$DEST/run-metadata.txt" <<EOF
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          source_head_sha=$GITHUB_SHA
          request_sha256=$request_sha
          scenario_id=$scenario_id
          capture_rc=$capture_rc
          artifact_name=phase12g-e7-live-batch
          review_outcome=UNREVIEWED
          interaction_outcome=UNREVIEWED
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f "$REQUEST"
          git add "$DEST"
          git commit -m "Record requested E7 live capture batch [skip ci]" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

          echo "capture_rc=$capture_rc; capture artifacts remain UNREVIEWED and cannot create E7 PASS."
          exit 0

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12c-runtime-evidence
          path: ${{ runner.temp }}/fmd-runtime-baseline
          if-no-files-found: warn
          retention-days: 14

      - name: Upload requested E7 live captures
        if: always() && steps.e7live.outputs.requested == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase12g-e7-live-batch
          path: ${{ runner.temp }}/fmd-e7-live-batch
          if-no-files-found: warn
          retention-days: 14
