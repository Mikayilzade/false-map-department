name: Manual Godot Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download pinned Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Run complete Phase 12A runtime baseline
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          FMD_RUNTIME_OUT: ${{ runner.temp }}/fmd-runtime-baseline
        run: bash scripts/run_phase12a_runtime.sh

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12a-runtime-evidence
          path: ${{ runner.temp }}/fmd-runtime-baseline
          if-no-files-found: warn
          retention-days: 14
