name: Manual Godot Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download pinned Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: CI notification-policy guard
        run: python3 scripts/ci_policy_preflight.py

      - name: Bootstrap preflight
        run: python3 scripts/bootstrap_preflight.py

      - name: Phase 12A contract audit
        run: python3 scripts/phase12a_contract_audit.py

      - name: Godot import and parse smoke
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Headless GDScript suite
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/test_runner.gd

      - name: Headless project main-scene boot smoke
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --quit-after 2
