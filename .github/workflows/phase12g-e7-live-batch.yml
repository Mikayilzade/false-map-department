# Trigger revision 2: merged while this workflow already exists on main.
name: Phase 12G E7 Live Capture One Shot

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/phase12g-e7-live-batch.yml'

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Execute and persist factual E7 capture batch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/fmd-e7-live-batch"
          DEST="runtime-evidence/phase12g/e7-live-batch"
          mkdir -p "$OUT" "$DEST"

          bash scripts/fetch_pinned_godot.sh /tmp/godot-4.7.1 > "$OUT/fetch-godot.stdout.log" 2> "$OUT/fetch-godot.stderr.log"
          fetch_rc=$?
          capture_rc=98
          if [ "$fetch_rc" -eq 0 ]; then
            GODOT_BIN="$(tail -n 1 "$OUT/fetch-godot.stdout.log")"
            python3 scripts/phase12g_e7_capture.py \
              --execute \
              --godot "$GODOT_BIN" \
              --output-dir "$OUT" \
              --scenario-id deck_controller_base \
              --dossier-id D29 \
              --dossier-id D33 \
              --dossier-id D36 \
              --dossier-id D38 \
              --dossier-id D40 \
              > "$OUT/capture-command.stdout.log" \
              2> "$OUT/capture-command.stderr.log"
            capture_rc=$?
          fi

          if [ -f "$OUT/capture-manifest.json" ]; then
            cp "$OUT/capture-manifest.json" "$DEST/capture-manifest.json"
          else
            printf '{"schema_version":1,"gate_id":"E7","evidence_kind":"CAPTURE_ACQUISITION_MANIFEST_NOT_REVIEW_OUTCOME","status":"CAPTURE_COMMAND_DID_NOT_PRODUCE_MANIFEST","fetch_rc":%s,"capture_rc":%s}\n' "$fetch_rc" "$capture_rc" > "$DEST/capture-manifest.json"
          fi
          if [ -f "$OUT/runtime-readiness.json" ]; then
            cp "$OUT/runtime-readiness.json" "$DEST/runtime-readiness.json"
          fi
          cat > "$DEST/run-metadata.txt" <<EOF
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          source_head_sha=$GITHUB_SHA
          scenario_id=deck_controller_base
          dossiers=D29,D33,D36,D38,D40
          fetch_rc=$fetch_rc
          capture_rc=$capture_rc
          artifact_name=phase12g-e7-live-batch
          review_outcome=UNREVIEWED
          interaction_outcome=UNREVIEWED
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/phase12g-e7-live-batch.yml
          git add "$DEST"
          git commit -m "Record E7 live capture batch and remove one-shot workflow [skip ci]" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

          echo "fetch_rc=$fetch_rc capture_rc=$capture_rc; factual outcome recorded in metadata/manifest. No E7 PASS is inferred."
          exit 0

      - name: Upload actual E7 capture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12g-e7-live-batch
          path: ${{ runner.temp }}/fmd-e7-live-batch
          if-no-files-found: warn
          retention-days: 14
